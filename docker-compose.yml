services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project_evaluation
      POSTGRES_USER: project
      POSTGRES_PASSWORD: project
    ports:
      - "5432:5432"
    volumes:
      - project-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: project
      MINIO_ROOT_PASSWORD: project-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - project-object-storage:/data

volumes:
  project-postgres:
  project-object-storage:
